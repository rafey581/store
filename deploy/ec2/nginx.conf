# /etc/nginx/sites-available/store
# Replace yourstore.pk with your domain. Certbot adds the HTTPS (443) block automatically.

limit_req_zone $binary_remote_addr zone=store_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name yourstore.pk www.yourstore.pk;

    # Payment screenshots and product images up to 5 MB (server actions allow 8 MB).
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Next.js build assets are content-hashed: cache them for a year.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Light rate limit on API routes (the app has its own limits too).
    location /api/ {
        limit_req zone=store_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/store-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/store-proxy.conf;
    }
}
